<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRESSUR - FORGING GREATNESS</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }

        /* The SVG container itself */
        svg {
            width: 100%;
            max-width: 500px;
            height: auto;
        }

        /* 1. Tracing Animation (Forge phase) */
        #circle-glow {
            stroke-dasharray: 1256; 
            stroke-dashoffset: 1256; 
            /* Fix: Explicitly set origin to local 0,0 instead of 'center' */
            transform-origin: 0px 0px; 
            animation: forgeCircle 1.5s ease-out forwards,
                       glowPulseAndRotate 4s linear 1.5s infinite; 
        }

        /* Standard text fade (all text fades in together) */
        #text-pressur, #text-tagline {
            opacity: 0;
            animation: fadeInText 1s ease-out 1.2s forwards;
        }

        /* --- CSS Keyframes --- */

        /* Drawing the circle */
        @keyframes forgeCircle {
            0% { stroke-dashoffset: 1256; }
            100% { stroke-dashoffset: 0; }
        }

        /* Text fade-in */
        @keyframes fadeInText {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 
           The perpetual glow pulse and rotation. 
           Applied ONLY to the circle so the text remains readable.
        */
        @keyframes glowPulseAndRotate {
            0% {
                transform: rotate(0deg);
                filter: url(#neonGlow);
            }
            50% {
                transform: rotate(180deg);
                filter: url(#neonPulse); /* Intense pulse filter */
            }
            100% {
                transform: rotate(360deg);
                filter: url(#neonGlow);
            }
        }
    </style>
</head>
<body>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
      <defs>
        <!-- Standard Glow -->
        <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        
        <!-- Intense Pulse Glow -->
        <filter id="neonPulse" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        
        <linearGradient id="gradient-neon" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#00e5ff; stop-opacity:1" />
          <stop offset="100%" style="stop-color:#ff00e6; stop-opacity:1" />
        </linearGradient>
      </defs>

      <!-- 
        Center the group structurally.
        We apply animations to the children, not the parent group, 
        to avoid compounding transform issues.
      -->
      <g id="logo-container" transform="translate(250, 250)">
        
        <circle id="circle-glow" cx="0" cy="0" r="200" fill="none" stroke="url(#gradient-neon)" stroke-width="6" filter="url(#neonGlow)" />
        
        <text id="text-pressur" x="0" y="-15" text-anchor="middle" dominant-baseline="central" fill="white" font-family="sans-serif" font-weight="bold" font-size="60" filter="url(#neonGlow)">
          <tspan>PRESSUR</tspan><tspan font-size="28" dy="-25">™</tspan>
        </text>
        
        <text id="text-tagline" x="0" y="55" text-anchor="middle" dominant-baseline="central" fill="white" font-family="sans-serif" font-weight="normal" font-size="18" letter-spacing="2.5" filter="url(#neonGlow)">
          WHERE GREATNESS IS FORGED
        </text>
      </g>
    </svg>

</body>
</html>
