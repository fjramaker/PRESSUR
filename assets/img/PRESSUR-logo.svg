<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Define the Gradient and Glow -->
  <defs>
    <!-- Glow filter for the text and circle -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Pulse filter for intense glow (used for circle only) -->
    <filter id="neonPulse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Linear Gradient for the glowing circle -->
    <linearGradient id="gradient-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff; stop-opacity:1" /> <!-- Blue -->
      <stop offset="100%" style="stop-color:#ff00e6; stop-opacity:1" /> <!-- Pink/Magenta -->
    </linearGradient>
  </defs>

  <!-- Container to hold and center everything -->
  <g id="logo-container" transform="translate(250, 250)">
    
    <!-- The Glowing Gradient Circle -->
    <circle id="circle-glow" cx="0%" cy="0%" r="200" fill="none" stroke="url(#gradient-neon)" stroke-width="6" filter="url(#neonGlow)" />
    
    <!-- Text Elements -->
    <!-- PRESSUR with TM symbol -->
    <text id="text-pressur" x="0%" y="-20" text-anchor="middle" dominant-baseline="central" fill="white" font-family="sans-serif" font-weight="bold" font-size="64" filter="url(#neonGlow)">
      <tspan>PRESSUR</tspan><tspan font-size="32" dy="-20">™</tspan>
    </text>
    
    <!-- Subtitle Text -->
    <text id="text-tagline" x="0%" y="60" text-anchor="middle" dominant-baseline="central" fill="white" font-family="sans-serif" font-weight="normal" font-size="20" letter-spacing="2" filter="url(#neonGlow)">
      WHERE GREATNESS IS FORGED
    </text>
  </g>
</svg>
