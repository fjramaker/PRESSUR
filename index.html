<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRESSUR™ - Acoustic Wellness</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <script src="js/session.js"></script>
		
		<style>
				/* ---- Splash mark animation (inside the login card's left panel) ---- */
				#circle-glow {
						stroke-dasharray: 1256;
						stroke-dashoffset: 1256;
						transform-origin: 0px 0px;
						animation: forgeCircle 1.5s ease-out forwards,
											 glowPulseAndRotate 4s linear 1.5s infinite;
				}
				#text-pressur, #text-tagline {
						opacity: 0;
						animation: fadeInText .8s ease-out .9s forwards;
				}
				@keyframes forgeCircle { 0% { stroke-dashoffset: 1256; } 100% { stroke-dashoffset: 0; } }
				@keyframes fadeInText { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
				@keyframes glowPulseAndRotate {
						0% { transform: rotate(0deg); filter: url(#neonGlow); }
						50% { transform: rotate(180deg); filter: url(#neonPulse); }
						100% { transform: rotate(360deg); filter: url(#neonGlow); }
				}

				/* ---- Page entrance flourish ---- */
				.fade-up { opacity: 0; animation: pageFadeUp .7s cubic-bezier(.2,.7,.2,1) forwards; }
				@keyframes pageFadeUp { 0% { opacity: 0; transform: translateY(16px); } 100% { opacity: 1; transform: translateY(0); } }

				.logo-glow { filter: drop-shadow(0 0 10px rgba(54, 209, 255, .45)); }

				.live-dot {
						display: inline-block; width: 6px; height: 6px; border-radius: 50%;
						background: var(--cyan); margin-right: 2px;
						animation: livePulse 1.8s ease-in-out infinite;
				}
				@keyframes livePulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
		</style>
		
</head>
<body>

    <div class="container-fluid vh-100 d-flex flex-column justify-content-center align-items-center main-wrapper">
        
        <div class="text-center mb-5 content-width fade-up" style="animation-delay:.05s">
            <h1 class="display-4 fw-bold mb-3 title-gradient logo-glow">PRESSUR™</h1>
            <p class="lead text-secondary-light">
                PRESSUR™ represents a breakthrough in multi-sensory healing, combining cutting-edge binaural beat technology with user-centered design.
            </p>
        </div>

        <div class="card login-card shadow-lg fade-up" style="animation-delay:.2s">
            <div class="row g-0 h-100">
                
								 <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center img-panel">
										<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" style="width:100%;max-width:320px;height:auto">
												<defs>
														<filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
																<feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
																<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
														</filter>
														<filter id="neonPulse" x="-50%" y="-50%" width="200%" height="200%">
																<feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
																<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
														</filter>
														<linearGradient id="gradient-neon" x1="0%" y1="0%" x2="100%" y2="100%">
																<stop offset="0%" style="stop-color:#180FFE; stop-opacity:1" />
																<stop offset="100%" style="stop-color:#F40AFC; stop-opacity:1" />
														</linearGradient>
												</defs>
												<g id="logo-container" transform="translate(250, 250)">
														<circle id="circle-glow" cx="0" cy="0" r="200" fill="none" stroke="url(#gradient-neon)" stroke-width="6" filter="url(#neonGlow)" />
														<text id="text-pressur" x="0" y="-15" text-anchor="middle" dominant-baseline="central" fill="white" font-family="'Archivo', sans-serif" font-weight="800" font-size="60" filter="url(#neonGlow)">
																<tspan>PRESSUR</tspan><tspan font-size="28" dy="-25">™</tspan>
														</text>
														<text id="text-tagline" x="0" y="55" text-anchor="middle" dominant-baseline="central" fill="white" font-family="'Archivo', sans-serif" font-weight="400" font-size="16" letter-spacing="2.5" filter="url(#neonGlow)">
																WHERE GREATNESS IS FORGED
														</text>
												</g>
										</svg>
								</div>

                <div class="col-md-6 p-5 d-flex flex-column justify-content-center">
                    <h3 class="mb-4 text-white">Welcome Back</h3>
                    
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="userSelect" class="form-label text-muted small">SELECT USER</label>
                            <select class="form-select custom-input" id="userSelect">
                                <option value="new" selected>+ Create New Profile</option>
                                </select>
                        </div>

                        <div class="mb-3" id="nameGroup">
                            <label for="userName" class="form-label text-muted small">NAME</label>
                            <div class="input-group">
                                <span class="input-group-text custom-addon"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control custom-input" id="userName" placeholder="Enter your name">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="userPin" class="form-label text-muted small">4-DIGIT PIN</label>
                            <div class="input-group">
                                <span class="input-group-text custom-addon"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control custom-input" id="userPin" maxlength="4" placeholder="••••" inputmode="numeric">
                            </div>
                        </div>

                        <div class="d-grid">
														<button type="submit" class="btn btn-gradient" style="padding:15px 30px">
																Start session
														</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const userSelect = document.getElementById('userSelect');
        const nameGroup = document.getElementById('nameGroup');

        userSelect.addEventListener('change', function() {
            if (this.value === 'new') {
                nameGroup.style.display = 'block';
            } else {
                nameGroup.style.display = 'none';
            }
        });
    </script>
    <script src="js/app.js"></script>
</body>
</html>
